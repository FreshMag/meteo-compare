<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Rischio Piovischio è stato spostato su https://rischio-piovischio.bid/" />
    <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://rischio-piovischio.bid/" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='20' cy='19' r='9' fill='%23f5b400'/%3E%3Cpath d='M15 40h21a8 8 0 0 0 .6-15.98A11 11 0 0 0 15.4 26.6 6.8 6.8 0 0 0 15 40z' fill='%23e6e8eb' stroke='%238b939c' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <title>Rischio Piovischio</title>
    <style>
      :root {
        color-scheme: light;
        --page: #f4f4f1;
        --surface: #fcfcfb;
        --ink: #0b0b0b;
        --ink-2: #52514e;
        --border: #0b0b0b1a;
        --accent: #1c5cab;
        --shadow: 0 1px 2px #0b0b0b0a, 0 4px 16px #0b0b0b0a;
        --radius: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.45;
        -webkit-text-size-adjust: 100%;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --page: #0d0d0d;
          --surface: #1a1a19;
          --ink: #fff;
          --ink-2: #c3c2b7;
          --border: #ffffff1a;
          --accent: #86b6ef;
          --shadow: none;
        }
      }
      * { box-sizing: border-box; }
      body {
        background: var(--page);
        color: var(--ink);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 16px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 560px;
        width: 100%;
        padding: 28px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p { margin: 0; font-size: 17px; color: var(--ink-2); overflow-wrap: anywhere; }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Ciao :)</h1>
      <p>
        Rischio Piovischio è stato spostato qui:
        <a href="https://rischio-piovischio.bid/">https://rischio-piovischio.bid/</a>
      </p>
    </main>
  </body>
</html>
